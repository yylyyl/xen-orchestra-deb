name: Build for release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get target version and git ref
        run: |
          cat target.txt
          cat target.txt >> $GITHUB_ENV

      - name: Checkout xen-orchestra
        uses: actions/checkout@v7
        with:
          repository: vatesfr/xen-orchestra
          ref: ${{ env.XO_REF  }}
          path: src

      - name: Run debian container
        run: |
          docker run -d --name builder -v ./:/workdir debian:13-slim tail -f /dev/null

      - name: Install tools in container
        run: |
          docker exec builder sh -c 'apt-get update && apt-get install -y curl build-essential libfuse-dev'

      - name: Setup Node.js
        run: |
          docker exec builder sh -c 'curl -fsSL https://deb.nodesource.com/setup_24.x | bash -'
          docker exec builder sh -c 'apt-get install -y nodejs'

      - name: Setup yarn
        run: |
          docker exec builder sh -c 'curl -sS https://dl.yarnpkg.com/debian/pubkey.gpg -o /etc/apt/trusted.gpg.d/yarn.asc'
          docker exec builder sh -c 'echo "deb https://dl.yarnpkg.com/debian/ stable main" | tee /etc/apt/sources.list.d/yarn.list'
          docker exec builder sh -c 'apt-get update && apt-get install -y yarn'

      - name: yarn
        run: |
          docker exec builder sh -c 'cd /workdir/src && yarn'

      - name: yarn build
        run: |
          docker exec builder sh -c 'cd /workdir/src && yarn build'

