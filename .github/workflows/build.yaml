name: Build for release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get target version and git ref
        run: |
          cat target.txt
          cat target.txt >> $GITHUB_ENV

      - name: Checkout xen-orchestra
        uses: actions/checkout@v7
        with:
          repository: vatesfr/xen-orchestra
          ref: ${{ env.XO_REF }}
          path: src

      - name: Run debian container
        run: |
          docker run -d --name builder -v ./:/workdir debian:13-slim tail -f /dev/null

      - name: Install tools in container
        run: |
          docker exec builder sh -c 'apt-get update && apt-get install -y git curl build-essential libfuse-dev'
          docker exec builder sh -c 'git config --global --add safe.directory /workdir/src'

      - name: Setup Node.js
        run: |
          docker exec builder sh -c 'curl -fsSL https://deb.nodesource.com/setup_24.x | bash -'
          docker exec builder sh -c 'apt-get install -y nodejs'

      - name: Setup yarn
        run: |
          docker exec builder sh -c 'curl -sS https://dl.yarnpkg.com/debian/pubkey.gpg -o /etc/apt/trusted.gpg.d/yarn.asc'
          docker exec builder sh -c 'echo "deb https://dl.yarnpkg.com/debian/ stable main" | tee /etc/apt/sources.list.d/yarn.list'
          docker exec builder sh -c 'apt-get update && apt-get install -y yarn'

      - name: "Command: yarn"
        run: |
          docker exec builder sh -c 'cd /workdir/src && yarn'

      - name: Apply patches
        run: |
          cd patch
          ./patch.sh

      - name: "Command: yarn build"
        run: |
          docker exec builder sh -c 'cd /workdir/src && yarn build'

      - name: Build deb
        run: |
          DEB="xen-orchestra-${{ env.XO_VERSION }}"
          mkdir -p $DEB/opt/xo
          mv src $DEB/opt/xo/xen-orchestra
          cp -r DEBIAN-13 $DEB/DEBIAN
          cp -r etc $DEB/etc
          cp $DEB/opt/xo/xen-orchestra/packages/xo-server/sample.config.toml $DEB/etc/xo-server/config.toml
          ln -s /opt/xo/xo-server/sample.config.toml $DEB/etc/xo-server/sample.config.toml
          ln -s /opt/xo/xen-orchestra/packages/xo-cli $DEB/opt/xo/xo-cli
          ln -s /opt/xo/xen-orchestra/packages/xo-server $DEB/opt/xo/xo-server
          ln -s /opt/xo/xen-orchestra/packages/xo-web $DEB/opt/xo/xo-web
          ln -s /opt/xo/xen-orchestra/@xen-orchestra $DEB/opt/xo/xo-web-v6
          docker exec builder sh -c 'cd /workdir && dpkg-deb --root-owner-group -b xen-orchestra-${{ env.XO_VERSION }}'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: xen-orchestra-${{ env.XO_VERSION }}.deb
          archive: false

